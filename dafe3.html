<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- custom css file link  -->
    <link rel="stylesheet" href="dafe3.css">

</head>
<body>
<div class="container">
    <form id="myForm">
        <div class="row">
            <div class="col">
                <h3 class="title">billing address</h3>
                <div class="inputBox">
                    <span>full name :</span>
                    <input id="fname" type="text" placeholder="Mohamad">
                </div>
                <div class="inputBox">
                    <span>email :</span>
                    <input id="email" type="email" placeholder="example@example.com">
                </div>
                <div class="inputBox">
                    <span>address :</span>
                    <input id="adress" type="text" placeholder="room - street - locality">
                </div>
                <div class="inputBox">
                    <span>city :</span>
                    <input id="city" type="text" placeholder="Beirut">
                </div>
                <div class="flex">
                    <div class="inputBox">
                        <span>state :</span>
                        <input id="state" type="text" placeholder="Lebanon">
                    </div>
                    <div class="inputBox">
                        <span>zip code :</span>
                        <input id="zipecode" type="text" placeholder="123 456">
                    </div>
                </div>

            </div>

            <div class="col">
                <h3 class="title">payment</h3>
                <div class="inputBox">
                    <span>cards accepted :</span>
                    <img src="card_img.png" alt="">
                </div>
                <div class="inputBox">
                    <span>name on card :</span>
                    <input id="card" type="text" placeholder="Mr. Mohamad ">
                </div>
                <div class="inputBox">
                    <span>credit card number :</span>
                    <input id="credit" type="tel" placeholder="1111-2222-3333-4444">
                </div>
                <div class="inputBox">
                    <span>exp month :</span>
                    <input id="exp"  type="text" placeholder="january">
                </div>

                <div class="flex">
                    <div class="inputBox">
                        <span>exp year :</span>
                        <input id="expy" type="number" placeholder="2018">
                    </div>
                    <div class="inputBox">
                        <span>CVV :</span>
                        <input id="CVV" type="text" placeholder="1234">
                    </div>
                </div>
            </div>
        </div>
        <input type="button" value="proceed to checkout" class="submit-btn">
    </form>
</div>    
<script>
    //-----------------------take variable--------------------------//
    var card = document.querySelector("#credit");
    var cvv = document.querySelector("#CVV");
    var fname = document.querySelector("#fname");
    var btn = document.querySelector(".submit-btn");
    var inp=document.getElementsByTagName("input");
    var email=document.querySelector("#email");
    var addres=document.getElementById("adress");
    var city=document.getElementById("city");
    var state=document.getElementById("state");
    var zip=document.getElementById("zipecode");
    var ncard=document.getElementById("card");
    var exp=document.getElementById("exp");
    var expy=document.getElementById("expy");

    //--------------------------------------------------------------//

    //-------------------------------regex--------------------------//
    regex =/[0-9]/;
    regex3 = /^[0-9]{3,}$/;
    regex2 = /[#$@?\/\.!]/;
    regexcard = /^[0-9]{4}\-[0-9]{4}\-[0-9]{4}\-[0-9]{4}$/;
    regexdate= /^[0-9]{2}\-[0-9]{2}\-[0-9]{4}$/;
    regexeamil=/@gmail\.com$/;
    regexzip=/^[0-9]{3}\-[0-9]{3}$/
    regexyear=/[a-zA-Z]/
    //--------------------------------------------------------------//

    //----------------------red tabi3i-------------------------------//
for(let i=0;i<inp.length-1;i++)
inp[i].addEventListener("click",function(){
    for(let j=0;j<inp.length;j++)
    inp[j].style.borderColor="black";
});

   //--------------------------------------------------------------//
    function check() {
       if (card.value ==="" || cvv.value ==="" || fname.value === ""|| email.value === ""|| addres.value === ""|| city.value === ""|| state.value === ""|| zip.value === ""|| ncard.value === ""|| exp.value === ""|| expy.value === "")
      {for(let i=0;i<inp.length-1;i++)
          if(inp[i].value==="")
          inp[i].style.borderColor="red";}
        else if(!regexcard.test(card.value))
      {alert("le card nombre doit etre (xxxx-xxxx-xxxx) tq(x nb)");
      inp[7].style.borderColor="red";}
      else if (regex.test(fname.value) || regex.test(ncard.value) || regex2.test(fname.value))
        {alert("le nom et le name card ne doivent contient pas des chiffre");
        inp[0].style.borderColor="red";
        inp[6].style.borderColor="red";}
        else if (fname.value.length < 4)
        {alert("donner un first name grand");
        inp[0].style.borderColor="red";}      
        else if(!regex3.test(cvv.value) || cvv.value.length!=4)
    {  alert("le cvv ne peut contient autre que 4 nombre");
    inp[10].style.borderColor="red";}
      else if(regex.test(exp.value))
    {alert("invalide month");
    inp[8].style.borderColor="red";}
    else if(regex.test(city.value))
    {alert("invalide city name");
    inp[3].style.borderColor="red";
    }
    else if(regex.test(state.value))
    {
        alert("invalide state");
    inp[4].style.borderColor="red";
    }
    else if(!regexeamil.test(email.value))
    {
        alert("invalid eamil info")
        inp[1].style.borderColor="red";
    }
    else if(!regexzip.test(zip.value))
    {
        alert("invalide zipe code the zipe (111-111)")
        inp[5].style.borderColor="red";
    }
    else if(regexyear.test(expy.value))
    {
        alert("invalide year")
        inp[9].style.borderColor="red";
    }
    else
    btn.type="submit";
    }
    //--------------------------------------------------------------/
    btn.addEventListener("click", check);
  
</script>
</body>
</html>
